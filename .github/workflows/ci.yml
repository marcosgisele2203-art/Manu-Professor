name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Sintaxe dos scripts do navegador
        run: node --check public/app.js && node --check public/sw.js
      - name: Build de produção
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: verificacao-automatica-0123456789
